import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workerp.widget'
    compileSdk 35

    defaultConfig {
        applicationId "com.workerp.widget"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        debug {
            // 폰에 그냥 두고 쓰는 앱이라 디버그 연결은 막는다.
            // 서명은 디버그 키 그대로여서 다음 판을 덮어 설치할 수 있다 (지웠다 깔 필요 없음).
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// WidgetLayoutTest 는 res/ 의 XML 을 직접 읽는다. 입력으로 걸어 두지 않으면
// XML 만 고쳤을 때 Gradle 이 테스트를 '최신'으로 보고 건너뛴다.
tasks.withType(Test).configureEach {
    inputs.dir('src/main/res').withPathSensitivity(PathSensitivity.RELATIVE)
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'

    // 날짜 계산·피드 해석은 안드로이드 없이 JVM 에서 검사한다 (./gradlew test)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
